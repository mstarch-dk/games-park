<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6e0"/><stop offset="1" stop-color="#5cc8f0"/>
    </linearGradient>
    <g id="eyes">
      <circle cx="0" cy="-5" r="3.4" fill="#fff"/><circle cx="1.3" cy="-5" r="1.8" fill="#1d1d2b"/>
      <circle cx="0" cy="5" r="3.4" fill="#fff"/><circle cx="1.3" cy="5" r="1.8" fill="#1d1d2b"/>
    </g>
  </defs>
  <!-- sø med mor and -->
  <rect width="320" height="44" fill="url(#pond)"/>
  <rect y="40" width="320" height="4" fill="#e9d8a6"/>
  <circle cx="40" cy="22" r="8" fill="#3fa34d"/><circle cx="270" cy="18" r="7" fill="#3fa34d"/><circle cx="268" cy="16" r="3" fill="#ffafcc"/>
  <g transform="translate(160 26)">
