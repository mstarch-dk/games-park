  <line x1="0" y1="142" x2="320" y2="142" stroke="#f4f4f4" stroke-width="2"/>
  <line x1="0" y1="107" x2="320" y2="107" stroke="#f4f4f4" stroke-width="2.5" stroke-dasharray="16 12"/>
  <!-- fodgængerfelt -->
  <rect x="126" y="66" width="40" height="82" fill="#3dff6e" opacity=".25"/>
  <g fill="#f4f4f4">
