    <rect x="-46" y="11" width="12" height="4" rx="1"/><rect x="-30" y="11" width="12" height="4" rx="1"/><rect x="-14" y="11" width="12" height="4" rx="1"/><rect x="2" y="11" width="12" height="4" rx="1"/>
